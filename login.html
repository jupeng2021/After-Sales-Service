<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 售后服务工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f3;color:#17251f;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(420px,calc(100% - 32px));background:white;border:1px solid #e3eae5;border-radius:17px;padding:30px;box-shadow:0 18px 50px #183b2a12}.logo{width:44px;height:44px;border-radius:13px;background:#176b4b;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800}.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.brand b{font-size:17px;display:block}.brand small{color:#718078;font-size:11px}.eyebrow{font-size:11px;color:#176b4b;font-weight:700;letter-spacing:.08em}.card h1{font-size:22px;margin:5px 0 4px}.desc{color:#718078;font-size:12px;margin:0 0 21px}.field{display:grid;gap:6px;margin:13px 0;color:#59665e;font-size:12px;font-weight:600}.field input{border:1px solid #e1e9e3;border-radius:9px;padding:11px 12px;font:inherit;color:#17251f;outline:none}.field input:focus{border-color:#79a88d;box-shadow:0 0 0 3px #e8f3ed}.hint{font-size:10px;color:#89958d;font-weight:400}.btn{width:100%;border:0;border-radius:9px;background:#176b4b;color:#fff;padding:11px;font:inherit;font-weight:700;margin-top:8px;cursor:pointer}.btn:hover{background:#10583d}.error{display:none;background:#fcebea;color:#9b3c35;border-radius:8px;padding:9px 11px;font-size:12px;margin:12px 0 0}.error.show{display:block}.security{border-top:1px solid #edf0ed;margin-top:20px;padding-top:13px;color:#8b968f;font-size:10px}
</style></head><body><main class="card"><div class="brand"><div class="logo">服</div><div><b>售后服务工作台</b><small>技术服务部 · 超级管理员</small></div></div><div class="eyebrow">SECURE ACCESS</div><h1 id="title">管理员登录</h1><p class="desc" id="desc">登录后管理服务记录与工作量。</p><form id="form"><label class="field">管理员账号<input id="username" autocomplete="username" required minlength="3" maxlength="40" placeholder="请输入账号"></label><label class="field">管理员密码<input id="password" type="password" autocomplete="current-password" required minlength="12" placeholder="至少 12 位"></label><button class="btn" id="submit" type="submit">登录</button><div class="error" id="error"></div></form><div class="security" id="security">首次使用时创建超管账号。账号和密码只用于本机服务登录。</div></main>
<script>
(async()=>{const $=id=>document.getElementById(id),form=$('form');let setup=false;try{const r=await fetch('/api/status');const s=await r.json();if(s.authenticated){location.replace('/');return}setup=s.setup_required}catch{$('error').textContent='无法连接服务，请确认本地服务已启动。';$('error').classList.add('show')}
if(setup){$('title').textContent='创建超管账号';$('desc').textContent='首次设置仅需创建一个超级管理员账号。';$('submit').textContent='创建账号并进入系统';$('security').textContent='请设置至少 12 位密码。密码只保存在本机数据库中。';$('password').autocomplete='new-password'}
form.onsubmit=async e=>{e.preventDefault();$('error').classList.remove('show');$('submit').disabled=true;try{const res=await fetch(setup?'/api/setup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'登录失败');location.href='/'}catch(err){$('error').textContent=err.message;$('error').classList.add('show');$('submit').disabled=false}}})();
</script></body></html>
