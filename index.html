<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>售后服务工作台</title>
  <style>
    :root{--ink:#17251f;--muted:#718078;--line:#e5ebe7;--paper:#f5f7f5;--green:#176b4b;--mint:#e8f3ed;--amber:#fff3dc;--red:#fcebea;--shadow:0 10px 28px #173a2810}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 9px 27px}.logo{width:36px;height:36px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-weight:800;font-size:18px}.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.nav-title{color:#a0aaa4;font-size:10px;letter-spacing:.12em;padding:0 11px 9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;border-radius:9px;padding:10px 11px;color:#59665e}.nav button.active{background:var(--mint);color:var(--green);font-weight:700}.nav button span{display:inline-block;width:23px;color:inherit}.side-foot{margin-top:auto;background:#f7f9f7;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--muted);font-size:11px}.side-foot b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}
    main{padding:29px clamp(18px,3vw,42px);max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{font-size:11px;color:var(--green);font-weight:700;letter-spacing:.08em}.top h1{margin:3px 0 4px;font-size:25px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:9px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--ink);font-weight:600}.btn:hover{border-color:#9db4a5}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#10583d}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:17px}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{height:28px;width:28px;border-radius:9px;display:grid;place-items:center;background:var(--mint);color:var(--green)}.stat strong{display:block;font-size:27px;margin:9px 0 1px;letter-spacing:-.03em}.stat small{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:15px;margin-bottom:17px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h2{font-size:15px;margin:0}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11px}.range{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;color:#59665e;font-size:12px}.bars{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:74px 1fr 29px;align-items:center;gap:10px;font-size:12px}.bar-label{color:#58665e}.bar-track{height:8px;background:#f0f3f0;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:#4b9871;border-radius:20px;min-width:0;transition:width .25s}.bar-num{text-align:right;color:#526057;font-variant-numeric:tabular-nums}.team{display:grid;gap:11px}.member{display:flex;align-items:center;gap:10px}.avatar{height:34px;width:34px;border-radius:50%;background:#eaf2ec;color:var(--green);display:grid;place-items:center;font-weight:700}.member-main{flex:1;min-width:0}.member-main b{font-size:12px;display:block}.member-main small{font-size:10px;color:var(--muted)}.member-count{text-align:right;font-weight:700}.member-count small{display:block;font-weight:400;color:var(--muted);font-size:10px}.section{margin-top:17px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.field{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;color:var(--ink);min-width:126px}.field.search{min-width:210px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th{text-align:left;color:#8a968e;font-weight:600;font-size:11px;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 9px;border-bottom:1px solid #edf0ed;font-size:12px;vertical-align:middle}tr:last-child td{border-bottom:0}.type-tag,.status{display:inline-flex;align-items:center;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap}.tag-delivery{background:#eaf1ff;color:#4168a8}.tag-maintain{background:var(--amber);color:#99701c}.tag-remote{background:#f0eaff;color:#7254a9}.tag-resident{background:#e5f5f1;color:#27816e}.tag-project{background:#f2ece7;color:#856446}.status.done{background:var(--mint);color:var(--green)}.status.processing{background:var(--amber);color:#9b741d}.status.pending{background:#eff1f0;color:#69766e}.muted{color:var(--muted)}.row-actions{display:flex;gap:5px}.link-btn{border:0;background:transparent;color:var(--green);padding:3px 4px;font-size:11px}.link-btn.delete{color:#b24942}.empty{text-align:center;padding:38px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}.footer-note{color:#9aa49d;font-size:10px;margin:12px 3px}
    .modal-back{position:fixed;inset:0;background:#101b1680;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:15px;box-shadow:0 25px 80px #0003}.modal-head{padding:20px 22px 12px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f2f4f2;border-radius:8px;width:31px;height:31px;font-size:18px}.form{padding:5px 22px 21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{display:grid;gap:5px;color:#627067;font-size:11px;font-weight:600}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;background:white;color:var(--ink);outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#79a88d;box-shadow:0 0 0 3px #e8f3ed}.form textarea{min-height:70px;resize:vertical}.form .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.help{font-weight:400;color:#98a29b;font-size:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20372a;color:white;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.toast.show{opacity:1}
    @media(max-width:920px){.layout{grid-template-columns:1fr}.side{display:none}main{padding:20px 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top h1{font-size:22px}}@media(max-width:520px){.top{display:block}.actions{margin-top:14px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}.form-grid{grid-template-columns:1fr}.form .wide{grid-column:auto}.field.search{min-width:100%;flex:1}.toolbar .field{flex:1}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="side"><div class="brand"><div class="logo">服</div><div><b>售后服务工作台</b><small>TECHNICAL SERVICE</small></div></div><div class="nav-title">工作空间</div><nav class="nav"><button class="active"><span>▦</span>工作概览</button><button id="navRecords"><span>☷</span>服务记录</button></nav><div class="side-foot"><b>技术服务部 · 3 人</b>陈巨鹏 · 部门经理<br>肖林 · 公司工程师<br>洪凯 · 北理莫斯科大学驻场</div></aside>
  <main>
    <header class="top"><div><div class="eyebrow">技术服务部 / 售后运营</div><h1>服务工作概览</h1><div class="sub">记录每一项服务，让团队工作量清晰可见。</div></div><div class="actions"><button class="btn" id="logoutBtn">退出登录</button><button class="btn" id="exportBtn">⇩ 导出记录</button><button class="btn primary" id="addBtn">＋ 新建服务记录</button></div></header>
    <section class="stats" id="stats"></section>
    <section class="grid"><div class="panel"><div class="panel-head"><div><h2>服务类型分布</h2><p>当前筛选周期内的任务数量</p></div><select class="range" id="period"><option value="month">本月</option><option value="all">全部时间</option><option value="year">今年</option></select></div><div class="bars" id="typeBars"></div></div><div class="panel"><div class="panel-head"><div><h2>成员工作量</h2><p>完成及处理中任务数</p></div></div><div class="team" id="team"></div></div></section>
    <section class="panel section" id="recordsPanel"><div class="panel-head"><div><h2>服务记录</h2><p id="recordCount">按任务跟踪处理过程与结果</p></div><div class="toolbar"><input class="field search" id="search" placeholder="搜索用户、项目、问题…"><select class="field" id="filterType"><option value="">全部类型</option></select><select class="field" id="filterPerson"><option value="">全部成员</option></select><select class="field" id="filterStatus"><option value="">全部状态</option><option>待处理</option><option>处理中</option><option>已完成</option></select></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>服务类型</th><th>用户 / 项目</th><th>处理人员</th><th>服务内容</th><th>用时</th><th>状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden><b>还没有服务记录</b>点击“新建服务记录”开始登记。</div></div></section>
    <div class="footer-note">数据保存在当前浏览器中。此版本适合单机试用；不同电脑或成员之间不会自动同步。</div>
  </main>
</div>
<div class="modal-back" id="modalBack"><section class="modal"><div class="modal-head"><h2 id="modalTitle">新建服务记录</h2><button class="close" id="closeModal" aria-label="关闭">×</button></div><form class="form" id="recordForm"><input type="hidden" id="recordId"><div class="form-grid">
  <label>服务日期 *<input id="date" type="date" required></label><label>服务类型 *<select id="type" required></select></label>
  <label>处理人员 *<select id="person" required></select></label><label>用户 / 单位 *<input id="customer" required placeholder="例如：北理莫斯科大学"></label>
  <label>所属项目<input id="project" placeholder="项目名称"></label><label>负责销售<input id="sales" placeholder="销售人员"></label>
  <label>服务地点<input id="location" placeholder="学校、用户现场或远程"></label><label>沟通 / 服务渠道<select id="channel"><option value="">请选择</option><option>现场处理</option><option>VPN</option><option>向日葵</option><option>工作群</option><option>电话</option><option>其他</option></select></label>
  <label>设备型号 / 配件<input id="equipment" placeholder="送货或更换时填写"></label><label>数量<input id="quantity" type="number" min="0" step="1" placeholder="可选"></label>
  <label>处理用时（小时）<input id="hours" type="number" min="0" step="0.25" placeholder="例如 1.5"></label><label>状态<select id="status"><option>待处理</option><option>处理中</option><option>已完成</option></select></label>
  <label class="wide">问题 / 服务内容 *<textarea id="description" required placeholder="记录用户问题、送货内容或群内安排"></textarea></label><label class="wide">处理结果 / 后续计划<textarea id="result" placeholder="处理措施、结果和待跟进事项"></textarea></label>
  </div><div class="modal-actions"><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary" type="submit">保存记录</button></div></form></section></div><div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body></html>
